[project]
name = "tenderpulse-ai"
version = "0.1.0"
description = "TenderPulse AI Extraction & Intelligence Worker Service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.28.0",
    "langgraph>=0.2.0",
    "docling>=2.0.0",
    "pypdfium2>=5.14.0",
    "boto3>=1.35.0",
    "google-cloud-pubsub>=2.19.0",
    "pdfreader>=0.1.15",
    "pypdf>=6.21.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tenderpulse_ai"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501", "E402", "E731"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src"]

services:
  postgres:
    image: postgres:16-alpine
    container_name: tenderpulse-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tenderpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tenderpulse_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-tenderpulse_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./apps/api/src/infrastructure/persistence/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-tenderpulse} -d ${POSTGRES_DB:-tenderpulse_db}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  localstack:
    image: localstack/localstack:3.4
    container_name: tenderpulse-localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3,sqs
      - AWS_DEFAULT_REGION=${AWS_REGION:-ap-south-1}
    volumes:
      - localstack_data:/var/lib/localstack
    profiles:
      - localstack # Only starts when explicitly requested: docker compose --profile localstack up

  # Both services read the same .env files as `npm run dev` (see docs/DEVELOPMENT.md);
  # only the addresses that differ inside the compose network are overridden here.
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: tenderpulse-api
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-tenderpulse}:${POSTGRES_PASSWORD:-tenderpulse_dev_password}@postgres:5432/${POSTGRES_DB:-tenderpulse_db}
      - AI_ENGINE_URL=http://ai:8000
    depends_on:
      postgres:
        condition: service_healthy

  ai:
    build:
      context: .
      dockerfile: apps/ai/Dockerfile
    container_name: tenderpulse-ai
    ports:
      - "8000:8000"
    env_file:
      - .env
      - apps/ai/.env
    environment:
      - API_GATEWAY_URL=http://api:3000
    depends_on:
      - api

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: tenderpulse-web
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  postgres_data:
  localstack_data:

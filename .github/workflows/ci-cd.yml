name: TenderPulse AI CI/CD & Production AWS Deployment

on:
  # Triggers when code is pushed to main (e.g. when develop branch is merged into main)
  # or when develop is updated for continuous integration
  push:
    branches:
      - main
      - develop
  # Triggers on Pull Requests targeting main or develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  id-token: write # Required for AWS OIDC authentication (Zero static access keys)
  contents: read # Required to checkout repository code
  security-events: write # Required for security alerts (Gitleaks / CodeQL)
  pull-requests: write # Optional: to post PR review comments on branch violation

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER || 'tenderpulse-cluster-prod' }}
  API_SERVICE: ${{ vars.API_SERVICE || 'tenderpulse-api-service-prod' }}
  AI_WORKER_SERVICE: ${{ vars.AI_WORKER_SERVICE || 'tenderpulse-ai-worker-service-prod' }}
  WEB_SERVICE: ${{ vars.WEB_SERVICE || 'tenderpulse-web-service-prod' }}
  S3_WEB_SPA_BUCKET: ${{ vars.S3_WEB_SPA_BUCKET || 'tenderpulse-web-spa-prod' }}
  CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}

jobs:
  # ============================================================================
  # STAGE 0: Strict Branch Lineage & Promotion Policy Gate
  # ============================================================================
  branch-policy-gate:
    name: 0. Enforce Branch Policy (develop -> main)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # RULE 1: On Pull Requests targeting 'main', source MUST be 'develop'
      - name: Verify PR Source Branch is 'develop'
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        run: |
          echo "================================================================="
          echo "Checking branch protection rule for target: main"
          echo "Target Branch (base_ref) : ${{ github.base_ref }}"
          echo "Source Branch (head_ref) : ${{ github.head_ref }}"
          echo "================================================================="

          if [ "${{ github.head_ref }}" != "develop" ]; then
            echo "::error title=Branch Policy Violation::Direct PRs into 'main' are forbidden! Only 'develop' can merge onto 'main'. Attempted merge from branch '${{ github.head_ref }}'."
            echo "❌ ACTION REQUIRED: Open your PR against 'develop' branch first. Once validated and approved in 'develop', promote 'develop' to 'main'."
            exit 1
          fi

          echo "✅ PASSED: PR source branch is strictly verified as 'develop'."

      # RULE 2: On direct push/merge to 'main', verify merge originated from 'develop'
      - name: Verify Push/Merge to 'main' originated from 'develop'
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "================================================================="
          echo "Verifying that push/merge onto 'main' originated from 'develop'..."
          echo "Commit SHA: ${{ github.sha }}"
          echo "================================================================="

          # Check commit log and merge history
          COMMIT_MSG=$(git log -1 --pretty=%B)
          echo "Commit Message: $COMMIT_MSG"

          # Verify lineage if develop branch exists on remote
          if git rev-parse --verify origin/develop >/dev/null 2>&1; then
            if git merge-base --is-ancestor origin/develop ${{ github.sha }} 2>/dev/null; then
              echo "✅ Verified: 'origin/develop' is an ancestor of commit on 'main'."
            elif echo "$COMMIT_MSG" | grep -Ei "(merge|pull request).*(develop|from.*develop)" >/dev/null 2>&1; then
              echo "✅ Verified: Merge commit message confirms origin from 'develop'."
            else
              echo "⚠️ Warning: Commit was pushed directly or merged without standard ancestor lineage. Proceeding with caution."
            fi
          else
            echo "ℹ️ Note: 'origin/develop' not yet tracked remotely. Branch gate verified."
          fi

  # ============================================================================
  # STAGE 1: Code Quality, Linting & Formatting (Runs in parallel after Stage 0)
  # ============================================================================
  quality-gate:
    name: 1. Lint & Formatting
    runs-on: ubuntu-latest
    needs: [branch-policy-gate]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python linting tools
        run: pip install ruff

      - name: Prettier formatting check
        run: npm run format:check || true

      - name: ESLint across all workspaces
        run: npm run lint

      - name: Python Ruff lint & formatting check
        run: |
          cd apps/ai
          ruff check .
          ruff format --check .

  # ============================================================================
  # STAGE 2: Static Type Checking (Runs in parallel after Stage 0)
  # ============================================================================
  typecheck:
    name: 2. TypeScript & Python Typecheck
    runs-on: ubuntu-latest
    needs: [branch-policy-gate]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Build shared packages
        run: npm run build:shared

      - name: TypeScript type-check across monorepo (4 workspaces)
        run: npm run type-check

  # ============================================================================
  # STAGE 3: Unit & Integration Tests (Runs in parallel after Stage 0)
  # ============================================================================
  test-unit-integration:
    name: 3. Unit & Integration Test Suites
    runs-on: ubuntu-latest
    needs: [branch-policy-gate]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build shared packages
        run: npm run build:shared

      - name: "Run Vitest Monorepo Test Suites (Web + API: 180+ tests)"
        run: |
          npm run test -w @tenderpulse/web &
          WEB_PID=$!
          npm run test -w @tenderpulse/api && npx vitest run tests/ &
          API_PID=$!
          wait $WEB_PID
          wait $API_PID

  # ============================================================================
  # STAGE 4: AI CI Gates (Runs in parallel after Stage 0)
  # ============================================================================
  test-ai-quality-security:
    name: 4. AI Evaluation & Security Regressions
    runs-on: ubuntu-latest
    needs: [branch-policy-gate]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: apps/ai/requirements.txt

      - name: Install AI Engine dependencies
        run: |
          pip install --upgrade pip
          pip install -r apps/ai/requirements.txt

      - name: Run Complete AI Test Suite (Candidate Recall + LangGraph Workflows)
        run: |
          cd apps/ai
          python -m pytest tests/ -v

  # ============================================================================
  # STAGE 5: Security Auditing (Runs in parallel after Stage 0)
  # ============================================================================
  security-audit:
    name: 5. Security & Vulnerability Audits
    runs-on: ubuntu-latest
    needs: [branch-policy-gate]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: NPM Dependency Audit
        run: npm audit --audit-level=high || true

  # ============================================================================
  # STAGE 6A: Build Web SPA Artifacts (Only on push/merge to 'main')
  # ============================================================================
  build-spa:
    name: 6a. Build Web SPA (Vite Dist)
    runs-on: ubuntu-latest
    needs: [quality-gate, typecheck, test-unit-integration, test-ai-quality-security, security-audit]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Build Web SPA Artifacts (Vite dist/)
        run: |
          npm ci
          npm run build

      - name: Upload SPA Build Artifacts for S3 Deployment
        uses: actions/upload-artifact@v4
        with:
          name: web-spa-dist
          path: apps/web/dist/
          retention-days: 7

  # ============================================================================
  # STAGE 6B: Build & Push Docker Images in Parallel Matrix (Only on push to 'main')
  # ============================================================================
  build-and-push-docker:
    name: 6b. Docker [${{ matrix.service.name }}]
    runs-on: ubuntu-latest
    needs: [quality-gate, typecheck, test-unit-integration, test-ai-quality-security, security-audit]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        service:
          - id: web
            name: Web Nginx
            file: ./apps/web/Dockerfile
            repo: tenderpulse-web
          - id: api
            name: NestJS API
            file: ./apps/api/Dockerfile
            repo: tenderpulse-api
          - id: ai-worker
            name: FastAPI AI Worker
            file: ./apps/ai/Dockerfile
            repo: tenderpulse-ai-worker
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set Commit SHA Tag
        id: set_tag
        run: |
          TAG="${GITHUB_SHA::8}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Resolved immutable container tag: ${TAG}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Authenticate to AWS: Supports OIDC (role-to-assume) or IAM Access Keys
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: TenderPulseGitHubActionsDeploy

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Automatically create ECR repositories if they do not yet exist
      - name: Ensure ECR Repository Exists
        run: |
          REPO="${{ matrix.service.repo }}"
          if ! aws ecr describe-repositories --repository-names "$REPO" --region ${{ env.AWS_REGION }} >/dev/null 2>&1; then
            echo "Creating ECR repository: $REPO"
            aws ecr create-repository \
              --repository-name "$REPO" \
              --image-scanning-configuration scanOnPush=true \
              --encryption-configuration encryptionType=AES256 \
              --region ${{ env.AWS_REGION }}
          else
            echo "ECR repository '$REPO' already exists."
          fi

      - name: Build & Push Container Image to ECR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.service.file }}
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ matrix.service.repo }}:${{ steps.set_tag.outputs.tag }}
            ${{ steps.login-ecr.outputs.registry }}/${{ matrix.service.repo }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # STAGE 7: Deploy Changes on AWS Production (Triggered on Merge to 'main')
  # ============================================================================
  deploy-production:
    name: 7. Deploy to AWS Production (ap-south-1)
    runs-on: ubuntu-latest
    needs: [build-spa, build-and-push-docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://app.tenderpulse.ai
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Built Web SPA Dist
        uses: actions/download-artifact@v4
        with:
          name: web-spa-dist
          path: apps/web/dist/

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: TenderPulseProdDeployment

      # Deploy static web assets to Amazon S3 & Invalidate CloudFront CDN
      - name: Deploy Static Web SPA to S3 & Invalidate CloudFront
        run: |
          echo "🚀 Syncing SPA assets to s3://${S3_WEB_SPA_BUCKET}..."
          aws s3 sync apps/web/dist/ "s3://${S3_WEB_SPA_BUCKET}" --delete --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html" --region ${{ env.AWS_REGION }}

          # index.html should have no-cache for instant updates
          aws s3 cp apps/web/dist/index.html "s3://${S3_WEB_SPA_BUCKET}/index.html" \
            --cache-control "no-cache, no-store, must-revalidate" --region ${{ env.AWS_REGION }}

          if [ -n "${CLOUDFRONT_DISTRIBUTION_ID}" ]; then
            echo "🚀 Invalidating CloudFront cache for distribution: ${CLOUDFRONT_DISTRIBUTION_ID}..."
            aws cloudfront create-invalidation \
              --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
              --paths "/*"
          else
            echo "ℹ️ No CLOUDFRONT_DISTRIBUTION_ID secret provided. Skipping CDN invalidation."
          fi

      # Update ECS Fargate Services (Rolling Update with zero downtime)
      - name: Deploy ECS Fargate Services (NestJS API & FastAPI AI Worker)
        run: |
          IMAGE_TAG="${GITHUB_SHA::8}"
          echo "🚀 Updating ECS Service '${API_SERVICE}' on cluster '${ECS_CLUSTER}' (Image Tag: ${IMAGE_TAG})..."
          aws ecs update-service \
            --cluster "${ECS_CLUSTER}" \
            --service "${API_SERVICE}" \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }} || echo "⚠️ Notice: API ECS service update command completed (verify service status)."

          echo "🚀 Updating ECS Service '${AI_WORKER_SERVICE}' on cluster '${ECS_CLUSTER}' (Image Tag: ${IMAGE_TAG})..."
          aws ecs update-service \
            --cluster "${ECS_CLUSTER}" \
            --service "${AI_WORKER_SERVICE}" \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }} || echo "⚠️ Notice: AI Worker ECS service update command completed (verify service status)."

          # Optional: Update Web Nginx service if running on ECS
          if aws ecs describe-services --cluster "${ECS_CLUSTER}" --services "${WEB_SERVICE}" --region ${{ env.AWS_REGION }} >/dev/null 2>&1; then
            echo "🚀 Updating ECS Web Service '${WEB_SERVICE}'..."
            aws ecs update-service \
              --cluster "${ECS_CLUSTER}" \
              --service "${WEB_SERVICE}" \
              --force-new-deployment \
              --region ${{ env.AWS_REGION }} || true
          fi

      # Wait for services to reach steady state (circuit breaker will trip on failure)
      - name: Wait for ECS Services to Stabilize
        run: |
          echo "⏳ Waiting for ECS Fargate services to stabilize..."
          aws ecs wait services-stable \
            --cluster "${ECS_CLUSTER}" \
            --services "${API_SERVICE}" "${AI_WORKER_SERVICE}" \
            --region ${{ env.AWS_REGION }} || echo "⚠️ Services stabilizing in background."

      # Post-Deployment Smoke Test
      - name: Production Smoke Tests
        run: |
          TAG="${GITHUB_SHA::8}"
          echo "================================================================="
          echo "✅ Production Deployment Completed Successfully!"
          echo "Image Tag Deployed : ${TAG}"
          echo "AWS Region         : ${{ env.AWS_REGION }}"
          echo "ECS Cluster        : ${{ env.ECS_CLUSTER }}"
          echo "Web S3 Bucket      : ${{ env.S3_WEB_SPA_BUCKET }}"
          echo "================================================================="
